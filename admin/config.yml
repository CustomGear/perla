backend:
  name: git-gateway
  branch: main

logo_url: "/images/cms-logo.svg?v=2"

media_folder: "uploads"
public_folder: "/uploads"

publish_mode: simple

collections:
  - name: "site"
    label: "Site Content"
    files:
      - name: "content"
        label: "Content"
        file: "content/site.json"
        format: "json"
        fields:
          - { label: "Site title (browser tab)", name: "title", widget: "string" }
          - { label: "Header logo text", name: "brandName", widget: "string" }
          - { label: "Instagram @username (reference)", name: "instagramUsername", widget: "string", required: false }

          - label: "SEO (titles & Google snippets)"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - label: "Home"
                name: "home"
                widget: "object"
                fields:
                  - { label: "Page title", name: "title", widget: "string" }
                  - { label: "Meta description", name: "description", widget: "text" }
              - label: "About"
                name: "about"
                widget: "object"
                fields:
                  - { label: "Page title", name: "title", widget: "string" }
                  - { label: "Meta description", name: "description", widget: "text" }
              - label: "Services"
                name: "services"
                widget: "object"
                fields:
                  - { label: "Page title", name: "title", widget: "string" }
                  - { label: "Meta description", name: "description", widget: "text" }
              - label: "Gallery"
                name: "gallery"
                widget: "object"
                fields:
                  - { label: "Page title", name: "title", widget: "string" }
                  - { label: "Meta description", name: "description", widget: "text" }
              - label: "Work with me"
                name: "workWithMe"
                widget: "object"
                fields:
                  - { label: "Page title", name: "title", widget: "string" }
                  - { label: "Meta description", name: "description", widget: "text" }

          - label: "Home"
            name: "home"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Name (line 1)", name: "nameLine1", widget: "string" }
              - { label: "Name (line 2)", name: "nameLine2", widget: "string" }
              - { label: "Role (under name)", name: "role", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Hero callout (next to ✦)", name: "callout", widget: "string" }
              - { label: "Hero portrait image", name: "heroPortrait", widget: "image", required: false }
              - { label: "Brands strip label", name: "brandsLabel", widget: "string" }
              - label: "Home “About” blurb"
                name: "blurb"
                widget: "object"
                fields:
                  - { label: "Small label", name: "label", widget: "string" }
                  - { label: "Heading", name: "title", widget: "string" }
                  - { label: "Paragraph", name: "text", widget: "text" }
                  - { label: "Callout line", name: "callout", widget: "string" }
              - label: "Reels section"
                name: "reelsSection"
                widget: "object"
                fields:
                  - { label: "Small label", name: "label", widget: "string" }
                  - { label: "Heading", name: "title", widget: "string" }
                  - { label: "Description (HTML ok for links)", name: "description", widget: "text" }
              - label: "Reels (4 tiles)"
                name: "reels"
                widget: "list"
                min: 4
                max: 4
                summary: "{{fields.type}}"
                fields:
                  - label: "Type"
                    name: "type"
                    widget: "select"
                    options: ["instagram", "video"]
                  - { label: "Instagram Reel/Post URL", name: "instagramUrl", widget: "string", required: false }
                  - { label: "Video file", name: "videoUrl", widget: "file", required: false }
                  - { label: "Cover image", name: "coverImage", widget: "image", required: false }

          - label: "About page"
            name: "about"
            widget: "object"
            fields:
              - label: "Hero"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Label (next to ✦)", name: "label", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "string" }
                  - { label: "Callout", name: "callout", widget: "string" }
              - { label: "Body (markdown: **bold**, blank line = new paragraph)", name: "intro", widget: "markdown" }

          - label: "Services page"
            name: "services"
            widget: "object"
            fields:
              - label: "Hero"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "string" }
                  - { label: "Callout", name: "callout", widget: "string" }
              - label: "Service cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }

          - label: "Work with me page"
            name: "workWithMe"
            widget: "object"
            fields:
              - { label: "Profile name", name: "name", widget: "string" }
              - { label: "Profile tagline", name: "tagline", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
              - { label: "Instagram handle", name: "instagramHandle", widget: "string" }
              - label: "Hero"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Intro", name: "intro", widget: "text" }
                  - { label: "Callout", name: "callout", widget: "string" }
                  - { label: "Badge (e.g. response time)", name: "responseBadge", widget: "string" }
              - label: "Contact form"
                name: "form"
                widget: "object"
                fields:
                  - { label: "Form title", name: "title", widget: "string" }
                  - { label: "Note under title", name: "note", widget: "text" }
                  - { label: "Hint under button", name: "hint", widget: "text" }
              - { label: "Intro beside contact card", name: "contactIntro", widget: "text" }

          - label: "Gallery page"
            name: "gallery"
            widget: "object"
            fields:
              - label: "Hero"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "string" }
                  - { label: "Callout", name: "callout", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - label: "Instagram embed URLs"
                name: "instagramUrls"
                widget: "list"
                fields:
                  - { label: "URL", name: "url", widget: "string" }

  - name: "reels"
    label: "Reels"
    files:
      - name: "reels"
        label: "Reel Cards"
        file: "content/reels.json"
        format: "json"
        fields:
          - label: "Reels"
            name: "reels"
            widget: "list"
            label_singular: "Reel"
            summary: "{{fields.brand}} — {{fields.caption}}"
            fields:
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false, hint: "Paste your reel link, e.g. https://www.instagram.com/reel/ABC123/ — use this OR the MP4 below, not both" }
              - { label: "Video file (MP4 — leave blank if using Instagram URL)", name: "video", widget: "string", required: false, hint: "e.g. videos/reel-1.mp4" }
              - { label: "Brand name (MP4 cards only)", name: "brand", widget: "string", required: false }
              - { label: "Caption (MP4 cards only)", name: "caption", widget: "string", required: false }
